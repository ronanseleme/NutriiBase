name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/ld/package-lock.json
      - name: Install app dependencies
        working-directory: web
        run: npm ci
      - name: Build app
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://yvsqvvjrprovcpfqmevh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Es3XTBHBEqoDHxUtP2-_hg_qYPjIE8i
        run: npm run build
      - name: Install landing page dependencies
        working-directory: web/ld
        run: npm ci
      - name: Build landing page
        working-directory: web/ld
        run: npm run build
      - name: Merge landing page into app build at /lp
        run: |
          mkdir -p web/dist/lp
          cp -r web/ld/dist/. web/dist/lp/
      - name: Add .nojekyll
        run: touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
