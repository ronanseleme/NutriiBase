name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate manual: exige aprovação de um reviewer configurado no ambiente
    # "production" (Settings > Environments) antes de rodar. Todo push em
    # main fica represado aqui até alguém aprovar o deploy pra produção.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy describe-meal --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy chat-assistant --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy transcribe-audio --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy analyze-meal-photo --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy list-plans --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy create-checkout-session --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy create-portal-session --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy subscription-details --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy manage-subscription --project-ref yvsqvvjrprovcpfqmevh
          supabase functions deploy system-status --project-ref yvsqvvjrprovcpfqmevh
          # --no-verify-jwt: o Stripe chama essa função sem token do Supabase —
          # a verificação de que a chamada é legítima é a assinatura HMAC do
          # corpo (STRIPE_WEBHOOK_SECRET), checada dentro do código.
          supabase functions deploy stripe-webhook --project-ref yvsqvvjrprovcpfqmevh --no-verify-jwt
