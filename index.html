<title>NutriiBase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F7;
    --surface:#FFFFFF;
    --text:#2B2B33;
    --text-soft:rgba(43,43,51,.62);
    --line:rgba(43,43,51,.13);
    --line-strong:rgba(43,43,51,.85);
    --orange:#FF6B35;
    --blue:#1B4B8F;
    --blue-light:#5FA8E0;
    --coral:#E8483A;
    --teal:#2FA88A;
    --protein:#FF6B35;
    --carb:#1B4B8F;
    --fat:#2FA88A;
    --on-accent:#FFFFFF;
    --shadow:0 1px 2px rgba(43,43,51,.06),0 10px 26px -16px rgba(43,43,51,.28);
  }
  /* NutriiBase is a deliberately light, brand-locked page (orange/blue on white) —
     no dark variant, per product decision. */

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;text-wrap:balance;font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font:inherit;}
  input,select,textarea{font:inherit;color:inherit;}
  .num{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  [hidden]{display:none!important;}

  .shell{max-width:920px;margin:0 auto;padding:0 16px 70px;}

  /* ---------- Topbar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.15rem;}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:var(--orange);display:inline-block;transform:rotate(45deg);}
  .profile-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .profile-btn:hover{background:var(--bg);}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:0 16px 10px;max-width:920px;margin:0 auto;-ms-overflow-style:none;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:none;background:transparent;color:var(--text-soft);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap;}
  .tab.active{background:var(--blue);color:var(--on-accent);}
  .tab:hover:not(.active){background:var(--bg);color:var(--text);}

  main{padding-top:16px;display:flex;flex-direction:column;gap:16px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);}
  .card-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--text-soft);}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:700;}
  .pill-blue{background:color-mix(in srgb, var(--blue) 14%, transparent);color:var(--blue);}
  .pill-teal{background:color-mix(in srgb, var(--teal) 16%, transparent);color:var(--teal);}
  .pill-coral{background:color-mix(in srgb, var(--coral) 16%, transparent);color:var(--coral);}
  .pill-orange{background:color-mix(in srgb, var(--orange) 16%, transparent);color:var(--orange);}

  .btn{border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:10px 16px;cursor:pointer;font-weight:700;font-size:.87rem;}
  .btn:hover{background:var(--bg);}
  .btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .btn-primary{background:var(--orange);border-color:var(--orange);color:var(--on-accent);box-shadow:0 3px 10px -3px color-mix(in srgb, var(--orange) 55%, transparent);}
  .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 5px 14px -3px color-mix(in srgb, var(--orange) 60%, transparent);}
  .btn-primary:active{transform:translateY(0);box-shadow:0 2px 6px -2px color-mix(in srgb, var(--orange) 55%, transparent);}
  .btn-primary:disabled{opacity:.45;cursor:default;filter:none;transform:none;box-shadow:none;}
  .btn-primary.btn-saved{background:var(--teal);border-color:var(--teal);box-shadow:0 3px 10px -3px color-mix(in srgb, var(--teal) 55%, transparent);}
  .btn-blue{background:var(--blue);border-color:var(--blue);color:var(--on-accent);}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--bg);}
  .btn-small{padding:6px 12px;font-size:.78rem;border-radius:8px;}
  .btn-block{width:100%;}
  .btn-danger{color:var(--coral);}

  /* ---------- Profile bar ---------- */
  .profile-bar{display:flex;align-items:center;gap:12px;}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--blue);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;font-family:'Space Grotesk',sans-serif;flex:0 0 auto;}
  .profile-bar-info{flex:1;min-width:0;}
  .profile-bar-name{font-weight:700;font-size:1.02rem;font-family:'Space Grotesk',sans-serif;}
  .profile-bar-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .info-chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border-radius:8px;padding:4px 9px;font-size:.74rem;color:var(--text-soft);font-weight:600;}
  .info-chip b{color:var(--text);}

  /* ---------- Chart ---------- */
  .chart-bars{display:flex;gap:3px;align-items:flex-end;height:130px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
  .bar-col .val-label{font-size:.58rem;font-weight:700;color:var(--text-soft);margin-bottom:3px;white-space:nowrap;}
  .bar-col .fill{width:70%;border-radius:3px 3px 0 0;min-height:2px;}
  .bar-col .bx-label{font-size:.6rem;color:var(--text-soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .chart-legend{display:flex;gap:14px;font-size:.74rem;color:var(--text-soft);margin-top:10px;}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;font-style:normal;}

  /* ---------- Insights tips ---------- */
  .tip-list{display:flex;flex-direction:column;gap:0;}
  .tip{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);}
  .tip:first-child{border-top:none;padding-top:0;}
  .tip-icon{font-size:1.05rem;flex:0 0 auto;line-height:1.4;}
  .tip-text{font-size:.86rem;}
  .tip-text b{display:block;margin-bottom:2px;}
  .ai-loading{display:flex;align-items:center;gap:8px;color:var(--text-soft);font-size:.85rem;padding:8px 0;}
  .ai-error{color:var(--coral);font-size:.84rem;padding:6px 0;}

  /* ---------- Dashboard ---------- */
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .datebar .nav{display:flex;align-items:center;gap:6px;}
  .datebar button{width:30px;height:30px;border-radius:50%;border:none;background:transparent;cursor:pointer;font-size:1.05rem;color:var(--text);}
  .datebar button:hover:not(:disabled){background:var(--bg);}
  .datebar button:disabled{opacity:.3;cursor:default;}
  .datebar .label{font-weight:700;text-transform:capitalize;min-width:9em;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:.92rem;}

  .warn{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb, var(--coral) 10%, var(--surface));border:1px solid color-mix(in srgb, var(--coral) 35%, transparent);border-radius:12px;padding:12px 14px;font-size:.84rem;}
  .warn strong{color:var(--coral);}

  .hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat{background:var(--bg);border-radius:12px;padding:10px 12px;}
  .stat .sv{font-size:1.5rem;font-weight:800;line-height:1;}
  .stat .sl{font-size:.72rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}

  .kpi-strip{display:flex;background:var(--bg);border-radius:14px;border:1px solid var(--line);overflow:hidden;}
  .kpi-cell{flex:1;min-width:0;padding:14px 4px 12px;text-align:center;border-top:3px solid transparent;display:flex;flex-direction:column;justify-content:center;gap:4px;}
  .kpi-cell + .kpi-cell{border-left:1px solid var(--line);}
  .kpi-v{font-size:1.68rem;font-weight:800;line-height:1;letter-spacing:-.02em;}
  .kpi-l{font-size:.6rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .kpi-sub{font-size:.58rem;color:var(--text-soft);line-height:1.25;}
  .kpi-breakdown{margin-top:6px;text-align:left;display:flex;flex-direction:column;gap:3px;}
  .kpi-breakdown-row{display:flex;align-items:center;gap:4px;font-size:.6rem;color:var(--text-soft);white-space:nowrap;}
  .kpi-breakdown-row i{width:6px;height:6px;border-radius:50%;flex:0 0 auto;font-style:normal;}
  .kpi-breakdown-row b{margin-left:auto;color:var(--text);font-weight:700;font-size:.68rem;padding-left:4px;}
  .kpi-progress{margin-top:14px;}
  .kpi-progress-label{display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-soft);margin-bottom:6px;}
  .kpi-progress-label b{color:var(--text);}

  .macro-row{padding:9px 0;border-top:1px solid var(--line);}
  .macro-row:first-of-type{border-top:none;padding-top:0;}
  .macro-line{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px;}
  .macro-line .label{font-weight:700;}
  .macro-line .vals{color:var(--text-soft);}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;}

  .quick-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .quick-actions .btn{flex:1;min-width:150px;}

  .weight-form{display:flex;gap:8px;align-items:center;}
  .weight-form input{flex:1;padding:9px 11px;border-radius:9px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);}

  /* ---------- Meals ---------- */
  .meal-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .meal-chip{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.82rem;white-space:nowrap;}
  .meal-chip.active{background:var(--blue);border-color:var(--blue);color:var(--on-accent);}
  .meal-chip .ct{color:var(--text-soft);font-size:.74rem;}
  .meal-chip.active .ct{color:var(--on-accent);opacity:.85;}

  .item-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row.draft{background:color-mix(in srgb, var(--orange) 6%, transparent);border-radius:10px;padding:9px 10px;border-bottom:none;margin-bottom:4px;}
  .item-name{font-weight:600;}
  .item-sub{color:var(--text-soft);font-size:.78rem;}
  .item-kcal{font-weight:700;font-size:1.02rem;min-width:3.6em;text-align:right;}
  .summary-head{display:grid;grid-template-columns:1fr repeat(4,44px);gap:4px;font-size:.62rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;padding-bottom:6px;border-bottom:1px solid var(--line);font-weight:700;}
  .summary-head .sr-kcal,.summary-head .sr-macro{text-align:right;}
  .summary-row{display:grid;grid-template-columns:1fr repeat(4,44px);gap:4px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.82rem;align-items:center;}
  .summary-row:last-of-type{border-bottom:none;}
  .summary-row .sr-kcal,.summary-row .sr-macro{text-align:right;font-weight:600;}
  .summary-total{border-top:2px solid var(--line-strong);margin-top:2px;padding-top:11px;font-weight:800;}
  .suggestion-box{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:12px;font-size:.85rem;display:flex;gap:8px;align-items:flex-start;}
  .item-macros{font-size:.72rem;color:var(--text-soft);margin-top:3px;}
  .item-macros b{color:inherit;font-weight:700;}
  .item-kcal-col{text-align:right;}
  .item-pct{font-size:.66rem;color:var(--text-soft);margin-top:2px;font-weight:600;}
  .item-actions{display:flex;gap:2px;}
  .item-del,.item-edit{border:none;background:transparent;color:var(--text-soft);cursor:pointer;width:24px;height:24px;border-radius:50%;font-size:1rem;flex:0 0 auto;}
  .item-del:hover{background:var(--line);color:var(--coral);}
  .item-edit{font-size:.82rem;}
  .item-edit:hover{background:var(--line);color:var(--blue);}
  .section-empty{color:var(--text-soft);font-style:italic;font-size:.85rem;padding:8px 0;}
  .draft-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);font-weight:800;margin:10px 0 6px;}

  /* ---------- Workout ---------- */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:.8rem;font-weight:700;color:var(--text-soft);}
  .field input,.field select,.field textarea{padding:9px 11px;border-radius:9px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .segmented{display:flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;}
  .segmented button{flex:1;padding:8px;border:none;background:var(--bg);color:var(--text);cursor:pointer;font-size:.85rem;}
  .segmented button.active{background:var(--blue);color:var(--on-accent);font-weight:700;}
  .estimate-box{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:12px 14px;margin:6px 0 14px;}
  .estimate-box .ev{font-size:1.5rem;font-weight:800;}

  /* ---------- Chat ---------- */
  .chat-log{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px 2px;}
  .msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:.88rem;line-height:1.5;white-space:pre-wrap;}
  .msg-user{align-self:flex-end;background:var(--blue);color:var(--on-accent);border-bottom-right-radius:4px;}
  .msg-assistant{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .chip{border:1px solid var(--blue-light);color:var(--blue);background:transparent;border-radius:999px;padding:6px 12px;font-size:.78rem;cursor:pointer;font-weight:600;}
  .chip:hover{background:color-mix(in srgb, var(--blue-light) 20%, transparent);}
  .chat-input-row{display:flex;gap:8px;margin-top:12px;}
  .chat-input-row input{flex:1;padding:10px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);}
  .chat-send{border-radius:50%;width:42px;height:42px;flex:0 0 auto;padding:0;}
  .chat-unavailable{text-align:center;color:var(--text-soft);font-size:.86rem;padding:20px 10px;}

  /* ---------- Insights ---------- */
  .month-nav{display:flex;align-items:center;justify-content:space-between;}
  .month-nav .label{font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .focus-banner{background:linear-gradient(135deg, color-mix(in srgb, var(--blue) 10%, var(--surface)), var(--surface));border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .weight-compare{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;}
  .weight-compare .wv{font-size:1.3rem;font-weight:800;}
  .weight-compare .wl{font-size:.7rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;}
  .badges{display:flex;flex-wrap:wrap;gap:8px;}
  .calc-memory-title{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);margin-bottom:6px;}
  .calc-steps{display:flex;flex-direction:column;}
  .calc-step{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line);}
  .calc-step:first-child{border-top:none;padding-top:0;}
  .calc-step .cs-label{font-size:.85rem;font-weight:600;}
  .calc-step .cs-sub{font-size:.74rem;color:var(--text-soft);margin-top:2px;}
  .calc-step .cs-value{font-weight:700;white-space:nowrap;font-size:.95rem;}
  .calc-step.total{border-top:2px solid var(--line-strong);margin-top:4px;padding-top:12px;}
  .calc-step.total .cs-label{font-weight:700;}
  .calc-step.total .cs-value{color:var(--orange);font-size:1.15rem;}
  .redistribute{font-size:.86rem;background:var(--bg);border-radius:12px;padding:12px 14px;}
  .redistribute b{color:var(--blue);}

  footer{text-align:center;color:var(--text-soft);font-size:.78rem;padding:26px 0 10px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,22,27,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .overlay[hidden]{display:none;}
  .modal{background:var(--surface);border-radius:18px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:22px 22px 24px;box-shadow:var(--shadow);}
  .modal h2{font-weight:700;font-size:1.3rem;margin-bottom:4px;}
  .modal-sub{color:var(--text-soft);font-size:.84rem;margin-bottom:16px;}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .target-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0;background:var(--bg);border-radius:12px;padding:12px;}
  .target-preview div{text-align:center;}
  .target-preview .tv{font-weight:800;font-size:1.2rem;display:block;}
  .target-preview .tl{font-size:.66rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .tag-toggle{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 12px;font-size:.78rem;cursor:pointer;}
  .tag-toggle.active{background:var(--teal);border-color:var(--teal);color:var(--on-accent);}
  .macro-edit{display:flex;align-items:center;gap:8px;font-size:.82rem;}
  .macro-edit input{width:70px;padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);}

  .search-box input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);margin-bottom:10px;}
  .food-results{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto;margin-bottom:8px;}
  .food-result{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:9px;border:none;background:transparent;text-align:left;cursor:pointer;color:var(--text);}
  .food-result:hover{background:var(--bg);}
  .food-result .fr-macro{font-size:.76rem;color:var(--text-soft);white-space:nowrap;}
  .food-empty{color:var(--text-soft);font-size:.84rem;padding:10px 4px;}
  .ai-food-box{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .ai-food-box textarea{padding:9px 11px;border-radius:9px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);min-height:56px;resize:vertical;}
  .selected-food{border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 14px;background:var(--bg);}
  .selected-food .sf-name{font-weight:700;margin-bottom:8px;}
  .sf-preview{display:flex;gap:14px;font-size:.8rem;color:var(--text-soft);margin-top:8px;flex-wrap:wrap;}
  .sf-preview b{color:var(--text);}

  @media (prefers-reduced-motion:no-preference){
    .btn,.item-del,.bar-fill,.tab,.meal-chip{transition:background-color .15s ease,filter .15s ease,width .3s ease,transform .15s ease,box-shadow .15s ease;}
  }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot"></span>NutriiBase</div>
    <button type="button" class="profile-btn" id="openProfile" aria-label="Editar perfil" title="Editar perfil">···</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Navegação principal">
    <button type="button" class="tab" data-tab="dashboard">Painel</button>
    <button type="button" class="tab" data-tab="food">Alimentação</button>
    <button type="button" class="tab" data-tab="workout">Treino</button>
    <button type="button" class="tab" data-tab="metas">Metas</button>
    <button type="button" class="tab" data-tab="chat">Chat IA</button>
    <button type="button" class="tab" data-tab="insights">Insights</button>
  </nav>
</div>

<div class="shell">
  <main>
    <div id="bannerSlot"></div>

    <section id="view-dashboard" data-view></section>
    <section id="view-food" data-view hidden></section>
    <section id="view-workout" data-view hidden></section>
    <section id="view-metas" data-view hidden></section>
    <section id="view-chat" data-view hidden></section>
    <section id="view-insights" data-view hidden></section>
  </main>

  <footer>NutriiBase — seu controle calórico e de treino, guardado só neste dispositivo.</footer>
</div>

<div class="overlay" id="profileOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <h2 id="profileTitle">Seu perfil</h2>
    <p class="modal-sub">Usado para calcular sua TMB, GET e meta diária (Harris-Benedict). Nada é salvo até você clicar em "Salvar perfil".</p>
    <form id="profileForm">
      <div class="field"><label for="pName">Nome</label><input type="text" id="pName" required></div>
      <div class="field-row">
        <div class="field"><label for="pAge">Idade</label><input type="number" id="pAge" min="10" max="100" required></div>
        <div class="field"><label>Sexo biológico</label>
          <div class="segmented" id="pSex"><button type="button" data-val="F" class="active">Feminino</button><button type="button" data-val="M">Masculino</button></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label for="pHeight">Altura (cm)</label><input type="number" id="pHeight" min="100" max="250" required></div>
        <div class="field"><label for="pWeight">Peso atual (kg)</label><input type="number" id="pWeight" step="0.1" min="30" max="300" required></div>
      </div>
      <div class="field">
        <label for="pBodyFat">Percentual de gordura corporal (%, opcional)</label>
        <input type="number" id="pBodyFat" step="0.1" min="3" max="60" placeholder="Ex: 18.5 — deixe em branco se não souber">
      </div>
      <div class="field"><label for="pActivity">Nível de atividade</label><select id="pActivity"></select></div>
      <div class="field-row">
        <div class="field"><label for="pGoal">Objetivo</label><select id="pGoal"></select></div>
        <div class="field"><label for="pPace">Ritmo</label><select id="pPace"></select></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="pTargetWeight">Peso-meta (kg, opcional)</label><input type="number" id="pTargetWeight" step="0.1" min="0"></div>
        <div class="field"><label for="pTargetDate">Data-meta (opcional)</label><input type="date" id="pTargetDate"></div>
      </div>
      <div class="field">
        <label>Restrições alimentares (opcional)</label>
        <div class="tags" id="pTags"></div>
        <input type="text" id="pRestrictionNote" placeholder="Outras restrições, em texto livre…">
      </div>
      <div id="safetyWarnSlot"></div>
      <div class="target-preview" id="targetPreview"></div>
      <div class="field">
        <label>Macros (g) — sugestão automática, edite se quiser</label>
        <div class="macro-edit">
          <span>Proteína</span><input type="number" id="pProteinG" min="0"> g
          <span style="margin-left:8px;">Gordura</span><input type="number" id="pFatG" min="0"> g
          <button type="button" class="btn btn-small" id="resetMacros" style="margin-left:auto;">Sugerir</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="cancelProfile">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar perfil</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="foodOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="foodTitle">
    <h2 id="foodTitle">Adicionar alimento</h2>
    <p class="modal-sub" id="foodSub"></p>
    <div class="segmented" id="foodModeToggle" style="margin-bottom:14px;">
      <button type="button" data-val="db" class="active">Base</button>
      <button type="button" data-val="ai">Perguntar à IA</button>
      <button type="button" data-val="manual">Manual</button>
    </div>
    <div id="dbSearchBlock">
      <div class="search-box"><input type="text" id="foodSearch" placeholder="Buscar alimento (ex: arroz, frango, banana)…" autocomplete="off"></div>
      <div class="food-results" id="foodResults"></div>
      <div id="selectedFoodSlot"></div>
    </div>
    <div id="aiFoodBlock" hidden>
      <div class="ai-food-box">
        <textarea id="aiFoodInput" placeholder="Descreva o alimento e a porção. Ex: 2 fatias de pão integral com um ovo frito e queijo"></textarea>
        <button type="button" class="btn btn-blue" id="aiFoodAsk">Perguntar à IA</button>
      </div>
      <div id="aiFoodResult"></div>
    </div>
    <form id="customFoodForm" hidden>
      <div class="field"><label for="cName">Nome do alimento</label><input type="text" id="cName" placeholder="Ex: Marmita da vovó"></div>
      <div class="field-row">
        <div class="field"><label for="cKcal">Calorias (kcal)</label><input type="number" id="cKcal" min="0"></div>
        <div class="field"><label for="cProt">Proteína (g)</label><input type="number" id="cProt" min="0" step="0.1"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="cCarb">Carboidratos (g)</label><input type="number" id="cCarb" min="0" step="0.1"></div>
        <div class="field"><label for="cFat">Gordura (g)</label><input type="number" id="cFat" min="0" step="0.1"></div>
      </div>
    </form>
    <div class="modal-footer">
      <button type="button" class="btn" id="cancelFood">Cancelar</button>
      <button type="button" class="btn btn-primary" id="confirmFood" disabled>Adicionar ao rascunho</button>
    </div>
  </div>
</div>

  /* ---------- date helpers ---------- */
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toISODate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseISODate(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function todayISO(){ return toISODate(new Date()); }
  function formatDateLabel(iso){
    var t=todayISO(), y=toISODate(addDays(new Date(),-1));
    if (iso===t) return "Hoje";
    if (iso===y) return "Ontem";
    return new Intl.DateTimeFormat("pt-BR",{weekday:"short", day:"numeric", month:"short"}).format(parseISODate(iso));
  }
  function monthLabel(y,m){
    var s = new Intl.DateTimeFormat("pt-BR",{month:"long", year:"numeric"}).format(new Date(y,m-1,1));
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }

  /* ---------- calc ---------- */
  function leanMassKg(p){
    if (p.bodyFatPct!=null && p.bodyFatPct>0 && p.bodyFatPct<70) return p.weightKg * (1 - p.bodyFatPct/100);
    return null;
  }
  function computeTargets(p){
    var lbm = leanMassKg(p);
    var tmb = lbm!=null
      ? (370 + 21.6*lbm)
      : (p.sex==="M" ? 66 + 13.7*p.weightKg + 5*p.heightCm - 6.8*p.age : 655 + 9.6*p.weightKg + 1.8*p.heightCm - 4.7*p.age);
    var activityEntry = ACTIVITY.filter(function(a){return a.key===p.activity;})[0] || ACTIVITY.filter(function(a){return a.key==="moderado";})[0];
    var act = activityEntry.factor;
    var get = tmb*act;
    var kcal, safety={belowFloor:false, belowTMB:false}, adjustmentKcal=0, adjustmentLabel="", usingGoalBased=false;
    var floor = p.sex==="M" ? 1500 : 1200;

    var goalDailyAdjustment = null;
    if (p.goal!=="manutencao" && p.targetWeightKg && p.bodyFatTargetPct!=null && p.bodyFatPct!=null && p.targetDate){
      var daysLeft = Math.round((parseISODate(p.targetDate) - parseISODate(todayISO())) / 86400000);
      if (daysLeft > 0){
        var currentFatMass = p.weightKg * (p.bodyFatPct/100);
        var targetFatMass = p.targetWeightKg * (p.bodyFatTargetPct/100);
        var fatChangeKg = targetFatMass - currentFatMass;
        goalDailyAdjustment = (fatChangeKg * 7700) / daysLeft;
      }
    }

    if (p.goal==="manutencao"){
      kcal = get;
      adjustmentLabel = "Sem ajuste — meta de manutenção";
    } else if (goalDailyAdjustment!=null){
      usingGoalBased = true;
      var rawGoal = get + goalDailyAdjustment;
      if (rawGoal < floor){ safety.belowFloor = true; kcal = floor; }
      else { kcal = rawGoal; }
      if (kcal < tmb) safety.belowTMB = true;
      adjustmentLabel = (goalDailyAdjustment>=0?"Superávit":"Déficit")+" de "+Math.abs(Math.round(goalDailyAdjustment))+" kcal/dia — calculado a partir da sua meta de "+p.targetWeightKg+" kg e "+p.bodyFatTargetPct+"% de gordura até "+new Intl.DateTimeFormat("pt-BR").format(parseISODate(p.targetDate))+(safety.belowFloor?" (ajustado ao mínimo seguro)":"");
    } else if (p.goal==="emagrecimento"){
      var deficitKcal = DEFICIT_KCAL[p.pace] || 500;
      var raw = get - deficitKcal;
      if (raw < floor){ safety.belowFloor = true; kcal = floor; adjustmentLabel = "Déficit ajustado ao mínimo seguro"; }
      else { kcal = raw; adjustmentLabel = "Déficit de "+deficitKcal+" kcal/dia (ritmo "+p.pace+") — defina peso-meta, % de gordura-meta e data-meta para um cálculo personalizado"; }
      if (kcal < tmb) safety.belowTMB = true;
    } else {
      var pct2 = SURPLUS_PCT[p.pace] || .10;
      kcal = get*(1+pct2);
      adjustmentLabel = "Superávit de "+Math.round(pct2*100)+"% (ritmo "+p.pace+") — defina peso-meta, % de gordura-meta e data-meta para um cálculo personalizado";
    }
    kcal = Math.round(kcal);
    adjustmentKcal = kcal - Math.round(get);
    var proteinBaseKg = lbm!=null ? lbm : p.weightKg;
    var proteinPerKg = p.goal==="emagrecimento" ? 2.0 : 1.8;
    var fatPerKg = 0.9;
    var protein = (p.macroOverride && p.macroOverride.proteinG!=null) ? p.macroOverride.proteinG : Math.round(proteinPerKg*proteinBaseKg);
    var fat = (p.macroOverride && p.macroOverride.fatG!=null) ? p.macroOverride.fatG : Math.round(fatPerKg*p.weightKg);
    var carb = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
    return {
      tmb:Math.round(tmb), get:Math.round(get), kcal:kcal, protein:protein, fat:fat, carb:carb, safety:safety,
      usingLBM: lbm!=null, leanMassKg: lbm!=null?Math.round(lbm*10)/10:null, usingGoalBased: usingGoalBased,
      activityFactor: act, activityLabel: activityEntry.label,
      adjustmentKcal: adjustmentKcal, adjustmentLabel: adjustmentLabel,
      proteinPerKg: proteinPerKg, proteinBaseKg: Math.round(proteinBaseKg*10)/10, fatPerKg: fatPerKg
    };
  }
  function suggestedMacros(p){
    var lbm = leanMassKg(p);
    var proteinBaseKg = lbm!=null ? lbm : p.weightKg;
    var proteinPerKg = p.goal==="emagrecimento" ? 2.0 : 1.8;
    return {proteinG: Math.round(proteinPerKg*proteinBaseKg), fatG: Math.round(0.9*p.weightKg)};
  }
  function scaledFood(base, grams){
    var s = grams/100;
    return {kcal:Math.round(base.kcal*s), protein:Math.round(base.p*s), carbs:Math.round(base.c*s), fat:Math.round(base.f*s)};
  }
  function runningMETFromSpeed(speedKmh){
    var speedMmin = speedKmh*1000/60;
    var vo2 = 0.2*speedMmin + 3.5;
    return Math.max(4, Math.min(18, vo2/3.5));
  }
  function computeWorkoutKcal(form, weightKg){
    var met, hours;
    if (form.type==="corrida" && form.mode==="distancia" && form.distanceKm>0 && form.paceMinKm>0){
      met = runningMETFromSpeed(60/form.paceMinKm);
      hours = (form.paceMinKm*form.distanceKm)/60;
    } else {
      var table = MET[form.type] || MET.outro;
      met = table[form.intensity] || table.moderada;
      hours = (form.durationMin||0)/60;
    }
    return Math.max(0, Math.round(met*weightKg*hours));
  }

  /* ---------- state ---------- */

    var m = {}; MEALS.forEach(function(k){ m[k.key]=[]; }); return m;

    if (!state.logs[iso]) state.logs[iso] = {weight:null, meals:emptyMeals(), workouts:[]};

    if (!state.logs[iso].workouts) state.logs[iso].workouts = [];
    return state.logs[iso];

  function seedState(){
    var profile = {
      name:"Ana", age:29, sex:"F", heightCm:165, weightKg:63, bodyFatPct:24,
      activity:"moderado", goal:"manutencao", pace:"moderado",
      targetWeightKg:60, targetDate:toISODate(addDays(new Date(),60)), bodyFatTargetPct:20, weeklyWorkoutGoal:4,

      macroOverride:null

    profile.targets = computeTargets(profile);

    var F = {}; FOODS.forEach(function(f){ F[f.name]=f; });
    function item(name, grams){
      var m = scaledFood(F[name], grams);
      return {id:"seed-"+name, name:name, grams:grams, kcal:m.kcal, protein:m.protein, carbs:m.carbs, fat:m.fat};
    }
    var t = todayISO();
    var logs = {};
    logs[t] = {
      weight:63.0,
      meals:Object.assign(emptyMeals(), {
        cafeDaManha:[item("Aveia em flocos",40), item("Banana",100), item("Café sem açúcar",200)],
        almoco:[item("Arroz branco cozido",150), item("Feijão carioca cozido",100), item("Peito de frango grelhado",120), item("Brócolis cozido",80)],
        lanche:[item("Iogurte grego",170), item("Castanha do Pará",15)]
      }),
      workouts:[{id:"seed-w1", type:"corrida", mode:"distancia", distanceKm:5, paceMinKm:6, durationMin:null, intensity:null, note:"Corrida leve no parque", kcal: computeWorkoutKcal({type:"corrida",mode:"distancia",distanceKm:5,paceMinKm:6}, 63)}]
    };
    var weightSeed = [[-20,64.6],[-18,64.5],[-16,64.3],[-14,64.4],[-12,64.1],[-10,64.0],[-8,63.8],[-6,63.6],[-4,63.5],[-2,63.2]];
    weightSeed.forEach(function(pair){
      var iso = toISODate(addDays(new Date(), pair[0]));
      logs[iso] = {weight:pair[1], meals:emptyMeals(), workouts:[]};
    });
    return {profile:profile, logs:logs, currentDate:t, isDemo:true, ui:{tab:"dashboard", foodMeal:"cafeDaManha"}};
  }

  function load(){
    var raw=null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    if (raw){
      try{
        var parsed = JSON.parse(raw);
        if (parsed && parsed.profile && parsed.logs){
          if (!parsed.currentDate) parsed.currentDate = todayISO();
          if (!parsed.ui) parsed.ui = {tab:"dashboard", foodMeal:"cafeDaManha"};
          // Always recompute targets fresh — a profile saved by an older version of
          // the app may have a stored `targets` object missing fields the current
          // calculation (and the Metas screen) expects.
          parsed.profile.targets = computeTargets(parsed.profile);
          state = parsed;
          return;
        }
      }catch(e){}
    }
    state = seedState();
    save();
  }
  function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(16).slice(2); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function flashSaved(btn, afterFn){
    if (!btn){ if (afterFn) afterFn(); return; }
    btn.disabled = true;
    btn.classList.add("btn-saved");

  function fmtNum(n){ return Number(n||0).toLocaleString("pt-BR", {maximumFractionDigits:1}); }
  function fmtSigned(n){ n=Number(n||0); return (n>=0?"+":"")+fmtNum(n); }

  /* ---------- totals ---------- */
  function mealTotals(items){
    return (items||[]).reduce(function(a,it){ a.kcal+=it.kcal; a.protein+=it.protein; a.carbs+=it.carbs; a.fat+=it.fat; return a; }, {kcal:0,protein:0,carbs:0,fat:0});
  }
  function dayFoodTotals(day){
    var acc={kcal:0,protein:0,carbs:0,fat:0};
    MEALS.forEach(function(m){ var t=mealTotals(day.meals[m.key]); acc.kcal+=t.kcal; acc.protein+=t.protein; acc.carbs+=t.carbs; acc.fat+=t.fat; });
    return acc;
  }
  function dayWorkoutKcal(day){ return (day.workouts||[]).reduce(function(s,w){ return s+w.kcal; }, 0); }

  /* ================= DASHBOARD ================= */
  function statusColor(pct){ return pct<=90 ? "var(--teal)" : (pct<=105 ? "var(--blue-light)" : "var(--coral)"); }

  function dayHasData(log){ return log && ((dayFoodTotals(log).kcal>0) || dayWorkoutKcal(log)>0); }
  function daySaldo(log){ var f=dayFoodTotals(log), b=dayWorkoutKcal(log); return f.kcal - (state.profile.targets.kcal+b); }

  function dailyBalanceSeries(n){
    var arr=[];
    for (var i=n-1;i>=0;i--){
      var d = addDays(new Date(), -i);
      var iso = toISODate(d);
      var log = state.logs[iso];
      arr.push({label: pad(d.getDate())+"/"+pad(d.getMonth()+1), saldo: dayHasData(log) ? daySaldo(log) : null});
    }
    return arr;
  }
  function monthlyBalanceSeries(n){
    var arr=[]; var now=new Date();
    for (var i=n-1;i>=0;i--){
      var d0 = new Date(now.getFullYear(), now.getMonth()-i, 1);
      var y=d0.getFullYear(), m=d0.getMonth()+1;
      var dim = daysInMonth(y,m);
      var isCur = (y===now.getFullYear() && m===now.getMonth()+1);
      var lastDay = isCur ? now.getDate() : dim;
      var sum=0, any=false;
      for (var dd=1; dd<=lastDay; dd++){
        var log = state.logs[y+"-"+pad(m)+"-"+pad(dd)];
        if (dayHasData(log)){ any=true; sum += daySaldo(log); }
      }
      arr.push({label: new Intl.DateTimeFormat("pt-BR",{month:"short"}).format(d0).replace(".",""), saldo: any?Math.round(sum):null});
    }
    return arr;
  }
  function renderBarSeries(series, legendLabel){
    var maxAbs = Math.max(1, Math.max.apply(null, series.map(function(s){ return s.saldo!=null?Math.abs(s.saldo):0; })));
    var bars = series.map(function(s){
      var h = s.saldo!=null ? Math.max(3, Math.round((Math.abs(s.saldo)/maxAbs)*60)) : 2;
      var color = s.saldo==null ? "var(--line)" : (s.saldo>0 ? "var(--coral)" : "var(--teal)");
      var title = s.saldo!=null ? (s.label+": "+fmtSigned(s.saldo)+" kcal") : (s.label+": sem dado");
      var valLabel = s.saldo!=null ? '<div class="val-label">'+fmtSigned(s.saldo)+'</div>' : '<div class="val-label">&nbsp;</div>';
      return '<div class="bar-col" title="'+esc(title)+'">'+valLabel+'<div class="fill" style="height:'+h+'px;background:'+color+';"></div><div class="bx-label">'+esc(s.label)+'</div></div>';
    }).join("");
    return '<div class="chart-bars">'+bars+'</div>'+
      '<div class="chart-legend"><span><i style="background:var(--teal);"></i>Dentro/abaixo da meta</span><span><i style="background:var(--coral);"></i>Acima da meta ('+legendLabel+')</span></div>';
  }

              '<span class="info-chip">'+esc(goalLabel)+'</span>'+

            '<div class="kpi-breakdown">'+
              '<div class="kpi-breakdown-row"><i style="background:var(--blue-light);"></i><span>Parado</span><b class="num">'+fmtNum(targets.tmb)+'</b></div>'+

        macroRow("Proteína", food.protein, targets.protein, "var(--protein)")+

      '</div>'+

        '<div class="card-title">'+chartTitle+
          '<div class="segmented" id="chartMode" style="width:auto;">'+
            '<button type="button" data-val="daily" class="'+(chartMode==="daily"?"active":"")+'">Diário</button>'+
            '<button type="button" data-val="monthly" class="'+(chartMode==="monthly"?"active":"")+'">Mensal</button>'+
          '</div>'+
        '</div>'+

      '</div>'+

        '</div>'+
      '</div>'+

        '<div class="card-title">Peso do dia <span class="muted" style="font-weight:500;font-size:.78rem;">(opcional)</span></div>'+
        '<div class="weight-form"><input type="number" id="weightInput" step="0.1" min="0" inputmode="decimal" value="'+(day.weight!=null?day.weight:"")+'" placeholder="kg"><button type="button" class="btn btn-primary btn-small" id="saveWeight">Salvar</button></div>'+
      '</div>';

    document.getElementById("pbEditProfile").addEventListener("click", openProfileModal);

  function macroRow(label, consumed, target, color){
    var pct = target>0 ? Math.min(100, Math.round((consumed/target)*100)) : 0;
    var over = target>0 && consumed>target;
    var extra = over ? ' <span style="color:var(--coral);">(+'+fmtNum(consumed-target)+' g)</span>' : "";
    return '<div class="macro-row"><div class="macro-line"><span class="label" style="color:'+color+';">'+label+'</span><span class="vals">'+fmtNum(consumed)+' / '+fmtNum(target)+' g'+extra+'</span></div><div class="bar"><div class="bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div></div>';
  }

  function changeDate(delta){
    var next = toISODate(addDays(parseISODate(state.currentDate), delta));
    if (delta>0 && next>todayISO()) return;
    state.currentDate = next; draft = {}; save(); renderAll();
  }

  /* ================= FOOD ================= */
  var SUGGESTION_POOL = {
    protein: ["Peito de frango grelhado","Ovo cozido","Iogurte grego","Whey protein (pó)"],
    carb: ["Batata doce cozida","Arroz integral cozido","Aveia em flocos","Banana"],
    fat: ["Abacate","Azeite de oliva","Castanha do Pará","Amendoim"]
  };
  function mealSummarySuggestion(totals, targets){
    var ratios = {
      protein: targets.protein>0 ? totals.protein/targets.protein : 1,
      carb: targets.carb>0 ? totals.carbs/targets.carb : 1,
      fat: targets.fat>0 ? totals.fat/targets.fat : 1
    };
    var lowest = Object.keys(ratios).reduce(function(a,b){ return ratios[a]<=ratios[b]?a:b; });
    if (ratios[lowest] >= 0.9) return "Seus macros estão bem equilibrados até agora hoje. 👏";
    var labels = {protein:"Sua proteína", carb:"Seu carboidrato", fat:"Sua gordura"};
    var pool = SUGGESTION_POOL[lowest];
    var food = pool[Math.floor(Date.now()/86400000) % pool.length];
    return labels[lowest]+" está a "+Math.round(ratios[lowest]*100)+"% da meta até agora — que tal incluir "+food+" na próxima refeição?";
  }
  function renderMealSummaryHtml(day, targets){
    var rows = MEALS.map(function(m){
      var t = mealTotals(day.meals[m.key]);
      return '<div class="summary-row"><span class="sr-name">'+m.label+'</span>'+
        '<span class="sr-kcal num">'+fmtNum(t.kcal)+'</span>'+
        '<span class="sr-macro num" style="color:var(--protein);">'+fmtNum(t.protein)+'</span>'+
        '<span class="sr-macro num" style="color:var(--carb);">'+fmtNum(t.carbs)+'</span>'+
        '<span class="sr-macro num" style="color:var(--fat);">'+fmtNum(t.fat)+'</span>'+
      '</div>';
    }).join("");
    var dayTotals = dayFoodTotals(day);
    var totalRow = '<div class="summary-row summary-total"><span class="sr-name">Total</span>'+
      '<span class="sr-kcal num">'+fmtNum(dayTotals.kcal)+'</span>'+
      '<span class="sr-macro num" style="color:var(--protein);">'+fmtNum(dayTotals.protein)+'</span>'+
      '<span class="sr-macro num" style="color:var(--carb);">'+fmtNum(dayTotals.carbs)+'</span>'+
      '<span class="sr-macro num" style="color:var(--fat);">'+fmtNum(dayTotals.fat)+'</span>'+
    '</div>';
    return '<div class="card">'+
      '<div class="card-title">Resumo por refeição</div>'+
      '<div class="summary-head"><span class="sr-name"></span><span class="sr-kcal">Kcal</span><span class="sr-macro" style="color:var(--protein);">Prot</span><span class="sr-macro" style="color:var(--carb);">Carb</span><span class="sr-macro" style="color:var(--fat);">Gord</span></div>'+
      rows + totalRow +
      '<div class="suggestion-box"><span>💡</span><span>'+esc(mealSummarySuggestion(dayTotals, targets))+'</span></div>'+
    '</div>';
  }
  function renderFood(){
    var day = ensureDay(state.currentDate);
    var active = state.ui.foodMeal || "cafeDaManha";
    var tabsHtml = MEALS.map(function(m){
      var t = mealTotals(day.meals[m.key]);
      return '<button type="button" class="meal-chip'+(m.key===active?" active":"")+'" data-meal="'+m.key+'">'+m.label+' <span class="ct">'+fmtNum(t.kcal)+'</span></button>';

        '<button type="button" class="btn btn-primary btn-block" id="saveMealBtn" style="margin-top:10px;" '+(drafted.length?"":"disabled")+'>Salvar refeição'+(drafted.length?" ("+drafted.length+")":"")+'</button>'+

  document.getElementById("view-food").addEventListener("click", function(e){
    var editBtn = e.target.closest("[data-edit]");

      if (eitem) openFoodModal(eparts[0], eitem);

  function itemRowHtml(it, mealKey, isDraft){

    return '<div class="item-row'+(isDraft?" draft":"")+'">'+
      '<div><div class="item-name">'+esc(it.name)+'</div>'+(it.grams?'<div class="item-sub">'+fmtNum(it.grams)+' g</div>':'')+
        '<div class="item-macros"><span style="color:var(--protein);">P <b class="num">'+fmtNum(it.protein)+'</b>g</span> · <span style="color:var(--carb);">C <b class="num">'+fmtNum(it.carbs)+'</b>g</span> · <span style="color:var(--fat);">G <b class="num">'+fmtNum(it.fat)+'</b>g</span></div>'+
      '</div>'+
      '<div class="item-kcal-col"><div class="item-kcal num">'+fmtNum(it.kcal)+' kcal</div><div class="item-pct num">'+pctGoal+'% da meta</div></div>'+
      '<div class="item-actions">'+editBtn+'<button type="button" class="item-del" data-del="'+(isDraft?"draft":"saved")+'|'+it.id+'" aria-label="Remover '+esc(it.name)+'">×</button></div>'+
    '</div>';
  }

  /* --- food modal --- */
  var foodOverlay = document.getElementById("foodOverlay");
  var addingMeal=null, selectedFood=null, foodMode="db", aiResultApplied=false, editingFoodRef=null;
  function openFoodModal(mealKey, editItem){
    addingMeal=mealKey; selectedFood=null; aiResultApplied=false;
    editingFoodRef = editItem ? {mealKey:mealKey, itemId:editItem.id} : null;
    document.getElementById("foodTitle").textContent = editItem ? "Editar alimento" : "Adicionar alimento";

  function setFoodMode(mode){

    var prompt = "Estime as informações nutricionais TOTAIS (não por 100g) para a seguinte porção de comida, em português do Brasil. "+
      "Responda apenas com um objeto JSON no formato exato {\"name\": string, \"kcal\": number, \"protein\": number, \"carbs\": number, \"fat\": number} "+
      "(protein/carbs/fat em gramas, referentes à PORÇÃO INTEIRA descrita).\n\nAlimento/porção: "+desc;
    sampleFn.json(prompt, {modelTier:"quick", cache:true}).then(function(data){
      btn.disabled=false;
      document.getElementById("aiFoodResult").innerHTML = "";
      document.getElementById("cName").value = String((data&&data.name) || desc).slice(0,80);
      document.getElementById("cKcal").value = Math.max(0, Math.round(Number(data&&data.kcal)||0));
      document.getElementById("cProt").value = Math.max(0, Math.round(Number(data&&data.protein)||0));
      document.getElementById("cCarb").value = Math.max(0, Math.round(Number(data&&data.carbs)||0));

        invalid_json:"A IA não retornou um resultado utilizável. Tente descrever de outra forma.",
        refused:"Não consegui estimar esse alimento. Tente reformular a descrição.",
        upstream_error:"Problema temporário para consultar a IA. Tente novamente."

  /* ================= WORKOUT ================= */
  var workoutForm = {type:"musculacao", mode:"duracao", durationMin:30, intensity:"moderada", distanceKm:5, paceMinKm:6, note:""};
  var editingWorkoutId = null;

  function workoutMonthlySeries(y,m){
    var dim = daysInMonth(y,m);
    var arr = [];
    for (var d=1; d<=dim; d++){
      var log = state.logs[y+"-"+pad(m)+"-"+pad(d)];
      arr.push({label:String(d), kcal: log?dayWorkoutKcal(log):0});
    }
    return arr;
  }
  function workoutYearlySeries(y){
    var arr = [];
    for (var m=1; m<=12; m++){
      var dim = daysInMonth(y,m), sum=0;
      for (var d=1; d<=dim; d++){
        var log = state.logs[y+"-"+pad(m)+"-"+pad(d)];
        if (log) sum += dayWorkoutKcal(log);
      }
      arr.push({label:new Intl.DateTimeFormat("pt-BR",{month:"short"}).format(new Date(y,m-1,1)).replace(".",""), kcal:sum});
    }
    return arr;
  }
  function renderMagnitudeBars(series){
    var max = Math.max(1, Math.max.apply(null, series.map(function(s){return s.kcal;})));
    var bars = series.map(function(s){
      var h = s.kcal>0 ? Math.max(3, Math.round((s.kcal/max)*70)) : 1;
      var title = s.label+": "+fmtNum(s.kcal)+" kcal";
      return '<div class="bar-col" title="'+esc(title)+'"><div class="fill" style="height:'+h+'px;background:'+(s.kcal>0?"var(--teal)":"var(--line)")+';"></div><div class="bx-label">'+esc(s.label)+'</div></div>';
    }).join("");
    return '<div class="chart-bars">'+bars+'</div>';
  }

  function renderWorkout(){

    var isRun = workoutForm.type==="corrida";
    var kcalEstimate = computeWorkoutKcal(workoutForm, state.profile.weightKg);

    var typeOptions = WORKOUT_TYPES.map(function(t){ return '<option value="'+t.key+'"'+(t.key===workoutForm.type?" selected":"")+'>'+t.label+'</option>'; }).join("");

      fieldsHtml = '<div class="field-row">'+

        '<div class="field"><label for="wPace">Pace (min/km)</label><input type="number" id="wPace" step="0.1" min="0" value="'+workoutForm.paceMinKm+'"></div>'+
      '</div>';
    } else {

        '<div class="field"><label>Intensidade</label><div class="segmented" id="wIntensity">'+
          ["leve","moderada","intensa"].map(function(i){ return '<button type="button" data-val="'+i+'" class="'+(workoutForm.intensity===i?"active":"")+'">'+i.charAt(0).toUpperCase()+i.slice(1)+'</button>'; }).join("")+

        '<div class="field"><label for="wType">Tipo de atividade</label><select id="wType">'+typeOptions+'</select></div>'+
        modeToggle+
        '<div style="margin-top:10px;">'+fieldsHtml+'</div>'+
        '<div class="field"><label for="wNote">Observações (opcional)</label><textarea id="wNote" placeholder="Ex: treino de perna, RPE 8">'+esc(workoutForm.note)+'</textarea></div>'+
        '<div class="estimate-box"><span class="muted">Gasto estimado</span><span class="ev num" id="workoutEstimateVal">'+fmtNum(kcalEstimate)+' kcal</span></div>'+
        '<div style="display:flex;gap:8px;">'+
          '<button type="button" class="btn btn-primary btn-block" id="saveWorkoutBtn">'+(editingWorkoutId?"Salvar alterações":"Salvar treino")+'</button>'+
          (editingWorkoutId ? '<button type="button" class="btn" id="cancelEditWorkout">Cancelar</button>' : '')+
        '</div>'+
      '</div>'+
      '<div class="card"><div class="card-title">Treinos de '+formatDateLabel(state.currentDate)+' <span class="pill pill-teal">'+fmtNum(dayWorkoutKcal(day))+' kcal</span></div>'+savedList+'</div>'+
      (function(){
        var wcY = workoutChartDate.y, wcM = workoutChartDate.m, now = new Date();
        var wcIsCurrentMonth = (wcY===now.getFullYear() && wcM===now.getMonth()+1);

        var wcLabel = workoutChartMode==="month" ? monthLabel(wcY,wcM) : String(wcY);

        return '<div class="card"><div class="card-title">Histórico de gasto por treino'+
            '<div class="segmented" id="workoutChartMode" style="width:auto;">'+
              '<button type="button" data-val="month" class="'+(workoutChartMode==="month"?"active":"")+'">Mês</button>'+
              '<button type="button" data-val="year" class="'+(workoutChartMode==="year"?"active":"")+'">Ano</button>'+

  /* ================= METAS ================= */
  function countWorkoutsThisWeek(){
    var now = new Date();
    var dow = now.getDay();
    var monday = addDays(now, dow===0 ? -6 : 1-dow);
    var count = 0;
    for (var i=0;i<7;i++){
      var log = state.logs[toISODate(addDays(monday, i))];
      if (log) count += (log.workouts||[]).length;
    }
    return count;
  }
  function calcStepHtml(label, value, sub, isTotal){
    return '<div class="calc-step'+(isTotal?" total":"")+'">'+
      '<div><div class="cs-label">'+label+'</div>'+(sub?'<div class="cs-sub">'+sub+'</div>':'')+'</div>'+
      '<div class="cs-value num">'+value+'</div>'+
    '</div>';
  }
  function calcMemoryKcalHtml(p, t){
    var tmbFormula = t.usingLBM ? ("Katch-McArdle — usa sua massa magra estimada de "+fmtNum(t.leanMassKg)+" kg") : "Harris-Benedict (revisada)";
    return calcStepHtml("TMB — o que seu corpo gasta parado, em repouso", fmtNum(t.tmb)+" kcal", "Fórmula: "+tmbFormula) +
      calcStepHtml("× Fator de atividade — "+esc(t.activityLabel), "GET "+fmtNum(t.get)+" kcal", "GET = Gasto Energético Total (TMB × "+t.activityFactor+")") +
      calcStepHtml(esc(t.adjustmentLabel), fmtSigned(t.adjustmentKcal)+" kcal") +
      calcStepHtml("Meta calórica diária", fmtNum(t.kcal)+" kcal", "", true);
  }
  function calcMemoryMacroHtml(p, t){
    return calcStepHtml("Proteína — "+t.proteinPerKg+" g/kg × "+fmtNum(t.proteinBaseKg)+" kg"+(t.usingLBM?" de massa magra":" de peso corporal"), '<span style="color:var(--protein);">'+fmtNum(t.protein)+' g</span>') +
      calcStepHtml("Gordura — "+t.fatPerKg+" g/kg × "+fmtNum(p.weightKg)+" kg de peso corporal", '<span style="color:var(--fat);">'+fmtNum(t.fat)+' g</span>') +
      calcStepHtml("Carboidrato — preenche o restante das calorias da meta", '<span style="color:var(--carb);">'+fmtNum(t.carb)+' g</span>');
  }
  function goalBar(pct, color){

  }
  function renderMetas(){
    var p = state.profile, t = p.targets;
    var leanMassNow = leanMassKg(p);

    var progressHtml;
    if (p.targetWeightKg){
      var entries = Object.keys(state.logs).filter(function(k){ return state.logs[k].weight!=null; }).sort();
      var startWeight = entries.length ? state.logs[entries[0]].weight : p.weightKg;
      var totalDelta = startWeight - p.targetWeightKg;
      var doneDelta = startWeight - p.weightKg;
      var pct = totalDelta!==0 ? Math.round((doneDelta/totalDelta)*100) : 100;
      var remaining = Math.abs(p.weightKg - p.targetWeightKg);
      progressHtml =
        '<div class="weight-compare" style="margin-bottom:10px;">'+
          '<div><div class="wv num">'+startWeight+'</div><div class="wl">Início</div></div>'+

          '<div><div class="wv num">'+p.targetWeightKg+'</div><div class="wl">Peso-meta</div></div>'+
        '</div>'+
        goalBar(pct, pct>=100?"var(--teal)":"var(--blue)")+
        '<p class="muted" style="font-size:.8rem;margin:8px 0 0;">Faltam '+remaining.toFixed(1)+' kg para a meta'+(p.targetDate?(" até "+new Intl.DateTimeFormat("pt-BR").format(parseISODate(p.targetDate))):"")+'.</p>';
    } else {
      progressHtml = "";
    }

    var bodyFatRowHtml = p.bodyFatPct
      ? '<div class="hero-stats" style="margin:10px 0;">'+
          '<div class="stat"><div class="sv num">'+p.bodyFatPct+'%</div><div class="sl">Gordura atual</div></div>'+
