  /* ================= CHAT ================= */
  function buildProfileContext(){
    var p = state.profile, t = p.targets;
    var lines = [];
    lines.push("Você é um nutricionista esportivo experiente, empático e baseado em evidência, especializado em nutrição esportiva e treino. Responda com naturalidade qualquer pergunta do usuário sobre alimentação, dieta, macros, suplementação, treino e hábitos saudáveis. Tom direto e motivador, nunca alarmista. Sempre que citar um número, explique o que ele significa na prática.");
    lines.push("Perfil do usuário: "+p.name+", "+p.age+" anos, "+(p.sex==="M"?"masculino":"feminino")+", "+p.heightCm+" cm, "+p.weightKg+" kg. Nível de atividade: "+p.activity+". Objetivo: "+p.goal+" (ritmo "+p.pace+").");
    if (p.targetWeightKg) lines.push("Peso-meta: "+p.targetWeightKg+" kg"+(p.targetDate?(" até "+p.targetDate):"")+".");
    var restr = (p.restrictions&&p.restrictions.tags||[]).concat(p.restrictions&&p.restrictions.note?[p.restrictions.note]:[]);
    if (restr.length) lines.push("Restrições alimentares: "+restr.join(", ")+".");
    lines.push("Meta diária calculada: "+t.kcal+" kcal (TMB "+t.tmb+", GET "+t.get+"), proteína "+t.protein+"g, carboidrato "+t.carb+"g, gordura "+t.fat+"g.");

    var todayIso = todayISO();
    var todayLog = state.logs[todayIso];
    if (todayLog){
      var tf = dayFoodTotals(todayLog), tb = dayWorkoutKcal(todayLog);
      var metaAjustadaHoje = t.kcal + tb;
      var restanteHoje = metaAjustadaHoje - tf.kcal;
      lines.push("HOJE ("+formatDateLabel(todayIso)+"): consumiu "+tf.kcal+" kcal de uma meta ajustada de "+metaAjustadaHoje+" kcal (meta base "+t.kcal+" kcal + "+tb+" kcal de exercício já feito hoje) — "+
        (restanteHoje>=0 ? "ainda faltam "+restanteHoje+" kcal para bater a meta de hoje." : "já ultrapassou a meta de hoje em "+Math.abs(restanteHoje)+" kcal.")+
        " Proteína hoje: "+tf.protein+" de "+t.protein+" g. Carboidratos: "+tf.carbs+" de "+t.carb+" g. Gordura: "+tf.fat+" de "+t.fat+" g."+
        (todayLog.weight!=null ? " Peso registrado hoje: "+todayLog.weight+" kg." : ""));
    }

    var recent = [];
    for (var i=6;i>=1;i--){
      var iso = toISODate(addDays(new Date(), -i));
      var d = state.logs[iso];
      if (!d) continue;
      var f = dayFoodTotals(d), b = dayWorkoutKcal(d);
      var hasData = f.kcal>0 || b>0 || d.weight!=null;
      if (!hasData) continue;
      recent.push(formatDateLabel(iso)+": consumiu "+f.kcal+" kcal, meta "+ (t.kcal+b) +" kcal (com exercício)"+(d.weight!=null?", peso "+d.weight+" kg":""));
    }
    if (recent.length) lines.push("Histórico dos últimos dias:\n"+recent.join("\n"));
    return lines.join("\n");
  }
  function buildContext(){
    return buildProfileContext() + "\n" +
      "Depois de responder, na última linha escreva exatamente: SUGESTOES: tema curto 1 | tema curto 2 | tema curto 3 — três chips de continuação relevantes ao que foi discutido, cada um até 6 palavras, sem numerar.";
  }
  function parseAssistantReply(text){
    var idx = text.lastIndexOf("SUGESTOES:");
    if (idx===-1) return {reply:text.trim(), chips:[]};
    var reply = text.slice(0, idx).trim();
    var rest = text.slice(idx + "SUGESTOES:".length);
    var chips = rest.split("|").map(function(s){ return s.trim(); }).filter(Boolean).slice(0,3);
    return {reply:reply, chips:chips};
  }
  function scrollChatToBottom(){
    var log = document.getElementById("chatLog");
    if (log) log.scrollTop = log.scrollHeight;
  }
  function renderChat(){
    var view = document.getElementById("view-chat");
    if (sampleFn === undefined){
      view.innerHTML = '<div class="card"><div class="chat-unavailable">Carregando assistente…</div></div>';
      return;
    }
    if (sampleFn === null){
      view.innerHTML = '<div class="card"><div class="chat-unavailable">O assistente de IA não está disponível neste visualizador. Você ainda pode usar todo o resto do NutriiBase normalmente.</div></div>';
      return;
    }
    var msgsHtml = chatHistory.length ? chatHistory.map(function(m,i){
      var isLast = i===chatHistory.length-1;
      var chipsHtml = (isLast && m.role==="assistant" && m.chips && m.chips.length) ? '<div class="chips">'+m.chips.map(function(c){ return '<button type="button" class="chip" data-chip="'+esc(c)+'">'+esc(c)+'</button>'; }).join("")+'</div>' : "";
      return '<div class="msg msg-'+m.role+'">'+esc(m.content)+'</div>'+chipsHtml;
    }).join("") : '<div class="chat-unavailable">Pergunte algo sobre sua alimentação, treino ou meta — o assistente conhece seu perfil e seu histórico recente.</div>';

    view.innerHTML =
      '<div class="card">'+
        '<div class="card-title">Assistente nutricional</div>'+
        '<div class="chat-log" id="chatLog">'+msgsHtml+'</div>'+
        '<div class="chat-input-row"><input type="text" id="chatInput" placeholder="Digite sua pergunta…" '+(chatBusy?"disabled":"")+'>'+
        '<button type="button" class="btn btn-primary chat-send" id="chatSend" aria-label="Enviar" '+(chatBusy?"disabled":"")+'>'+(chatBusy?"…":"➤")+'</button></div>'+
      '</div>';

    document.getElementById("chatSend").addEventListener("click", sendChat);
    document.getElementById("chatInput").addEventListener("keydown", function(e){ if (e.key==="Enter") sendChat(); });
    document.querySelectorAll("[data-chip]").forEach(function(b){
      b.addEventListener("click", function(){ document.getElementById("chatInput").value = b.dataset.chip; sendChat(); });
    });
    scrollChatToBottom();
  }
  var chatBusy = false;
  function sendChat(){
    if (chatBusy) return;
    var input = document.getElementById("chatInput");
    var text = input.value.trim();
    if (!text || !sampleFn) return;
    chatHistory.push({role:"user", content:text});
    chatBusy = true;
    renderChat();
    var turns = [{role:"user", content:buildContext()}];
    chatHistory.slice(0,-1).slice(-8).forEach(function(m){ turns.push({role:m.role, content:m.content}); });
    turns.push({role:"user", content:text});
    var placeholder = {role:"assistant", content:"Pensando…", chips:[]};
    chatHistory.push(placeholder);
    renderChat();
    sampleFn(turns, {
      cache:false, modelTier:"default",
      onText:function(u){ placeholder.content = u.text; renderChat(); }
    }).then(function(res){
      var parsed = parseAssistantReply(res.text);
      placeholder.content = parsed.reply;
      placeholder.chips = parsed.chips;
      chatBusy = false; renderChat();
    }).catch(function(err){
      var map = {
        not_granted:"Você optou por não usar o assistente de IA nesta sessão.",
        rate_limited:"Muitas mensagens em pouco tempo — aguarde um instante e tente de novo.",
        refused:"Não consegui responder a essa pergunta. Tente reformular.",
        upstream_error:"Tive um problema temporário para responder. Tente novamente."
      };
      placeholder.content = map[err.code] || "Não foi possível obter uma resposta agora.";
      placeholder.chips = [];
      chatBusy = false; renderChat();
    });
  }

  /* ================= INSIGHTS ================= */
  var insightsMonth = null; // {y,m}
  function renderInsights(){
    if (!insightsMonth){ var n=new Date(); insightsMonth = {y:n.getFullYear(), m:n.getMonth()+1}; }
    var y=insightsMonth.y, m=insightsMonth.m;
    var dim = daysInMonth(y,m);
    var t = state.profile.targets;
    var today = new Date();
    var isCurrentMonth = (y===today.getFullYear() && m===today.getMonth()+1);
    var lastDay = isCurrentMonth ? today.getDate() : dim;

    var bars=[], tracked=[], weightsInMonth=[];
    for (var d=1; d<=dim; d++){
      var iso = y+"-"+pad(m)+"-"+pad(d);
      var log = state.logs[iso];
      var hasData = log && ((dayFoodTotals(log).kcal>0) || dayWorkoutKcal(log)>0 || log.weight!=null);
      if (log && log.weight!=null) weightsInMonth.push({d:d, w:log.weight});
      if (hasData && d<=lastDay){
        var f = dayFoodTotals(log), burn = dayWorkoutKcal(log);
        var saldo = f.kcal - (t.kcal+burn);
        bars.push({d:d, saldo:saldo});
        tracked.push(saldo);
      } else {
        bars.push({d:d, saldo:null});
      }
    }
    var saldoAcumulado = tracked.reduce(function(s,v){return s+v;},0);
    var metaMensalSaldo = Math.round((t.kcal - t.get) * dim);
    var diasRestantes = isCurrentMonth ? Math.max(0, dim - lastDay) : 0;
    var redistribuicao = "";
    if (diasRestantes>0){
      var ajuste = Math.round((metaMensalSaldo - saldoAcumulado) / diasRestantes);
      var novaMeta = t.get + ajuste;
      redistribuicao = '<div class="redistribute">Nos <b>'+diasRestantes+'</b> dias restantes do mês, para ainda bater o objetivo mensal sua meta ajustada seria de aproximadamente <b>'+fmtNum(Math.round(novaMeta))+' kcal/dia</b>.</div>';
    } else if (tracked.length){
      redistribuicao = '<div class="redistribute">Mês encerrado — saldo calórico acumulado de <b>'+fmtSigned(saldoAcumulado)+' kcal</b> em relação à meta.</div>';
    } else {
      redistribuicao = '<div class="redistribute muted">Sem registros neste mês ainda.</div>';
    }

    var pesoInicio = weightsInMonth.length ? weightsInMonth[0].w : state.profile.weightKg;
    var pesoAtual = weightsInMonth.length ? weightsInMonth[weightsInMonth.length-1].w : state.profile.weightKg;
    var pesoMeta = state.profile.targetWeightKg;

    var maxAbs = Math.max(1, Math.max.apply(null, bars.map(function(b){ return b.saldo!=null ? Math.abs(b.saldo) : 0; })));
    var barsHtml = bars.map(function(b){
      var h = b.saldo!=null ? Math.max(3, Math.round((Math.abs(b.saldo)/maxAbs)*40)) : 2;
      var color = b.saldo==null ? "var(--line)" : (b.saldo>0 ? "var(--coral)" : "var(--teal)");
      var title = b.saldo!=null ? (b.d+": "+fmtSigned(b.saldo)+" kcal") : (b.d+": sem dado");
      return '<div title="'+title+'" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:52px;">'+
        '<div style="width:60%;height:'+h+'px;background:'+color+';border-radius:3px 3px 0 0;"></div></div>';
    }).join("");

    var streak = computeStreak();
    var goodDays = tracked.filter(function(v){ return Math.abs(v) <= t.kcal*0.1; }).length;

    var focoTxt = state.profile.goal==="manutencao" ? "Manutenção de peso" :
      (state.profile.goal==="emagrecimento" ? "Emagrecimento" : "Ganho de massa magra") +
      (state.profile.targetWeightKg ? " — meta de "+state.profile.targetWeightKg+" kg" : "");

    document.getElementById("view-insights").innerHTML =
      '<div class="card"><div class="month-nav"><button type="button" class="btn btn-small" id="miPrev">‹</button><span class="label">'+monthLabel(y,m)+'</span><button type="button" class="btn btn-small" id="miNext" '+(isCurrentMonth?"disabled":"")+'>›</button></div></div>'+
      '<div class="focus-banner"><div class="muted" style="font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;">Foco do mês</div><div style="font-weight:700;font-size:1.05rem;margin-top:4px;">'+esc(focoTxt)+'</div></div>'+
      '<div class="card"><div class="card-title">Saldo calórico diário</div><div style="display:flex;gap:2px;align-items:flex-end;">'+barsHtml+'</div>'+redistribuicao+'</div>'+
      '<div class="card"><div class="card-title">Peso no mês</div><div class="weight-compare">'+
        '<div><div class="wv num">'+pesoInicio+'</div><div class="wl">Início</div></div>'+
        '<div><div class="wv num">'+pesoAtual+'</div><div class="wl">Atual</div></div>'+
        '<div><div class="wv num">'+(pesoMeta!=null?pesoMeta:"—")+'</div><div class="wl">Meta</div></div>'+
      '</div></div>'+
      '<div class="card"><div class="card-title">Consistência</div><div class="badges">'+
        '<span class="pill pill-orange">🔥 '+streak+' dias seguidos registrando</span>'+
        '<span class="pill pill-teal">✅ '+goodDays+' dias dentro da meta</span>'+
      '</div></div>'+
      '<div class="card"><div class="card-title">Pontos de atenção</div><div class="tip-list">'+
        computeInsightTips().map(function(tip){ return '<div class="tip"><span class="tip-icon">'+tip.icon+'</span><div class="tip-text"><b>'+esc(tip.title)+'</b>'+esc(tip.text)+'</div></div>'; }).join("")+
      '</div></div>'+
      '<div class="card"><div class="card-title">Recomendações da IA</div>'+
        (sampleFn
          ? '<button type="button" class="btn btn-blue btn-block" id="aiInsightsBtn">Gerar dicas personalizadas</button><div id="aiInsightsResult"></div>'
          : '<p class="muted" style="font-size:.85rem;">Assistente de IA indisponível neste momento.</p>')+
      '</div>';

    document.getElementById("miPrev").addEventListener("click", function(){ insightsMonth.m--; if (insightsMonth.m<1){insightsMonth.m=12; insightsMonth.y--;} renderInsights(); });
    document.getElementById("miNext").addEventListener("click", function(){ if (isCurrentMonth) return; insightsMonth.m++; if (insightsMonth.m>12){insightsMonth.m=1; insightsMonth.y++;} renderInsights(); });
    var aiBtn = document.getElementById("aiInsightsBtn");
    if (aiBtn) aiBtn.addEventListener("click", askInsightsAI);
  }
  function computeInsightTips(){
    var p = state.profile, t = p.targets;
    var tips = [];

    var lastWeightIso = Object.keys(state.logs).filter(function(k){ return state.logs[k].weight!=null; }).sort().pop();
    var daysSinceWeight = lastWeightIso ? Math.round((parseISODate(todayISO()) - parseISODate(lastWeightIso)) / 86400000) : null;
    if (daysSinceWeight===null){
      tips.push({icon:"⚖️", title:"Registre seu peso", text:"Você ainda não registrou nenhum peso. Um registro semanal já é suficiente para acompanhar a tendência."});
    } else if (daysSinceWeight>=4){
      tips.push({icon:"⚖️", title:"Peso desatualizado", text:"Faz "+daysSinceWeight+" dias desde o último registro de peso. Registre hoje para manter a tendência confiável."});
    }

    var last7Workouts = 0;
    for (var i=0;i<7;i++){ var log=state.logs[toISODate(addDays(new Date(),-i))]; if (log && (log.workouts||[]).length) last7Workouts++; }
    if (last7Workouts===0){
      tips.push({icon:"🏃", title:"Nenhum treino recente", text:"Sem treinos registrados nos últimos 7 dias. Se você treinou, registrar ajuda a meta a refletir seu gasto real."});
    }

    if (p.targetWeightKg){
      var delta = p.weightKg - p.targetWeightKg;
      if (Math.abs(delta) < 0.3){
        tips.push({icon:"🎯", title:"Perto da meta de peso", text:"Você está a menos de 300 g do seu peso-meta de "+p.targetWeightKg+" kg."});
      } else if (p.targetDate){
        var daysLeft = Math.round((parseISODate(p.targetDate) - parseISODate(todayISO())) / 86400000);
        if (daysLeft>0){
          var weeklyRate = Math.abs(delta) / (daysLeft/7);
          if (weeklyRate > 1){
            tips.push({icon:"⚠️", title:"Ritmo agressivo para a data-meta", text:"Para chegar a "+p.targetWeightKg+" kg até a data-meta faltam "+daysLeft+" dias, exigindo cerca de "+weeklyRate.toFixed(1)+" kg/semana — acima do recomendado (até ~1 kg/semana). Considere adiar a data ou ajustar a meta."});
          } else {
            tips.push({icon:"📈", title:"No caminho para a meta", text:"Faltam "+Math.abs(delta).toFixed(1)+" kg em "+daysLeft+" dias — um ritmo de ~"+weeklyRate.toFixed(2)+" kg/semana, dentro do razoável."});
          }
        }
      }
    }

    var proteinRatios = [];
    for (var j=1;j<=7;j++){ var lg=state.logs[toISODate(addDays(new Date(),-j))]; if (lg && dayFoodTotals(lg).kcal>0) proteinRatios.push(dayFoodTotals(lg).protein / t.protein); }
    if (proteinRatios.length>=3){
      var avgRatio = proteinRatios.reduce(function(a,b){return a+b;},0)/proteinRatios.length;
      if (avgRatio < 0.85){
        tips.push({icon:"🥩", title:"Proteína abaixo da meta", text:"Na última semana sua proteína ficou em média em "+Math.round(avgRatio*100)+"% da meta. Priorize uma fonte de proteína em cada refeição."});
      }
    }

    if (t.safety && (t.safety.belowFloor || t.safety.belowTMB)){
      tips.push({icon:"⚠️", title:"Meta calórica no limite", text:"Sua meta atual está no mínimo seguro (ou abaixo da TMB). Considere um ritmo mais lento para emagrecimento sustentável."});
    }

    var streak = computeStreak();
    if (streak>=7) tips.push({icon:"🔥", title:"Boa consistência", text:"Você já registra há "+streak+" dias seguidos — é o que mais impacta resultado a longo prazo."});
    else if (streak===0) tips.push({icon:"📝", title:"Comece hoje", text:"Você ainda não registrou nada hoje. Um registro rápido já ajuda a manter a régua."});

    var generalPool = [
      "Distribua a proteína em 3–4 refeições ao longo do dia para melhor aproveitamento na síntese muscular.",
      "Beba água regularmente, principalmente em dias de treino mais intenso.",
      "Priorize alimentos minimamente processados na maior parte das refeições.",
      "Durma de 7 a 9 horas — o sono afeta diretamente a recuperação e a fome do dia seguinte.",
      "Carboidratos perto do treino ajudam performance e recuperação, especialmente em treinos intensos."
    ];
    var dayIdx = Math.floor(Date.now()/86400000) % generalPool.length;
    tips.push({icon:"💡", title:"Dica", text:generalPool[dayIdx]});

    return tips.slice(0,5);
  }
  function askInsightsAI(){
    var btn = document.getElementById("aiInsightsBtn");
    var out = document.getElementById("aiInsightsResult");
    if (!sampleFn) return;
    btn.disabled = true;
    out.innerHTML = '<div class="ai-loading">Analisando seu perfil e histórico…</div>';
    var prompt = buildProfileContext() + "\n\nCom base nesses dados, escreva de 3 a 4 recomendações curtas e práticas para este usuário (uma por linha, cada linha começando com \"- \"). Foque em ações concretas para os próximos dias, não repita os números já listados acima.";
    sampleFn(prompt, {modelTier:"default", cache:{gcTime:1800000}}).then(function(res){
      btn.disabled=false;
      var lines = res.text.split("\n").map(function(l){ return l.replace(/^[-•*]\s*/,"").trim(); }).filter(Boolean);
      out.innerHTML = lines.length ? '<div class="tip-list">'+lines.map(function(l){ return '<div class="tip"><span class="tip-icon">💡</span><div class="tip-text">'+esc(l)+'</div></div>'; }).join("")+'</div>' : "";
    }).catch(function(err){
      btn.disabled=false;
      var map = {
        not_granted:"Você optou por não usar a IA nesta sessão.",
        rate_limited:"Muitas solicitações em pouco tempo — tente novamente em instantes.",
        upstream_error:"Problema temporário para consultar a IA. Tente novamente."
      };
      out.innerHTML = '<div class="ai-error">'+(map[err.code]||"Não foi possível gerar recomendações agora.")+'</div>';
    });
  }
  function computeStreak(){
    var streak=0, cursor=new Date();
    for (var i=0;i<365;i++){
      var iso = toISODate(cursor);
      var log = state.logs[iso];
      var hasData = log && ((dayFoodTotals(log).kcal>0) || dayWorkoutKcal(log)>0 || log.weight!=null);
      if (hasData){ streak++; cursor=addDays(cursor,-1); } else break;
    }
    return streak;
  }

  /* ================= PROFILE MODAL ================= */
  var profileOverlay = document.getElementById("profileOverlay");
  var selectedSex="F", selectedTags=[];
  function fillSelect(sel, options, currentKey){
    sel.innerHTML = options.map(function(o){ return '<option value="'+o.key+'"'+(o.key===currentKey?" selected":"")+'>'+o.label+'</option>'; }).join("");
  }
  function readProfileForm(){
    return Object.assign({}, state.profile, {
      name: document.getElementById("pName").value.trim() || "Você",
      age: +document.getElementById("pAge").value || 30,
      sex: selectedSex,
      heightCm: +document.getElementById("pHeight").value || 165,
      weightKg: +document.getElementById("pWeight").value || 70,
      bodyFatPct: (+document.getElementById("pBodyFat").value) || null,
      activity: document.getElementById("pActivity").value,
      goal: document.getElementById("pGoal").value,
      pace: document.getElementById("pPace").value,
      targetWeightKg: (+document.getElementById("pTargetWeight").value) || null,
      targetDate: document.getElementById("pTargetDate").value || null,
      restrictions: {tags: selectedTags.slice(), note: document.getElementById("pRestrictionNote").value.trim()},
      macroOverride: {
        proteinG: (+document.getElementById("pProteinG").value) || null,
        fatG: (+document.getElementById("pFatG").value) || null
      }
    });
  }
  function refreshProfilePreview(){
    var p = readProfileForm();
    var t = computeTargets(p);
    document.getElementById("targetPreview").innerHTML =
      '<div><span class="tv num">'+fmtNum(t.tmb)+'</span><span class="tl">TMB</span></div>'+
      '<div><span class="tv num">'+fmtNum(t.get)+'</span><span class="tl">GET</span></div>'+
      '<div><span class="tv num">'+fmtNum(t.kcal)+'</span><span class="tl">Meta kcal</span></div>'+
      '<div><span class="tv num" style="color:var(--carb);">'+fmtNum(t.carb)+'</span><span class="tl">Carb g</span></div>';
    var w = document.getElementById("safetyWarnSlot");
    var warnHtml = (t.safety.belowFloor || t.safety.belowTMB)
      ? '<div class="warn" style="margin-bottom:12px;"><span>⚠️</span><div>'+(t.safety.belowFloor?"Déficit muito agressivo — meta ajustada para o mínimo seguro. ":"")+(t.safety.belowTMB?"A meta ainda fica abaixo da sua TMB.":"")+'</div></div>'
      : "";
    var lbmNote = t.usingLBM
      ? '<p class="muted" style="font-size:.78rem;margin-bottom:12px;">Usando a fórmula de Katch-McArdle com sua massa magra estimada ('+t.leanMassKg+' kg) — mais precisa quando o % de gordura é conhecido.</p>'
      : "";
    w.innerHTML = warnHtml + lbmNote;
  }
  function openProfileModal(){
    var p = state.profile;
    document.getElementById("pName").value=p.name;
    document.getElementById("pAge").value=p.age;
    document.getElementById("pHeight").value=p.heightCm;
    document.getElementById("pWeight").value=p.weightKg;
    document.getElementById("pBodyFat").value = p.bodyFatPct || "";
    document.getElementById("pTargetWeight").value = p.targetWeightKg || "";
    document.getElementById("pTargetDate").value = p.targetDate || "";
    document.getElementById("pRestrictionNote").value = (p.restrictions && p.restrictions.note) || "";
    selectedSex = p.sex;
    selectedTags = (p.restrictions && p.restrictions.tags) ? p.restrictions.tags.slice() : [];
    document.querySelectorAll("#pSex button").forEach(function(b){ b.classList.toggle("active", b.dataset.val===selectedSex); });
    document.getElementById("pTags").innerHTML = RESTRICTION_TAGS.map(function(tag){
      return '<button type="button" class="tag-toggle'+(selectedTags.indexOf(tag)!==-1?" active":"")+'" data-tag="'+esc(tag)+'">'+tag+'</button>';
    }).join("");
    fillSelect(document.getElementById("pActivity"), ACTIVITY, p.activity);
    fillSelect(document.getElementById("pGoal"), GOALS, p.goal);
    fillSelect(document.getElementById("pPace"), PACES, p.pace);
    var sm = suggestedMacros(p);
    document.getElementById("pProteinG").value = (p.macroOverride && p.macroOverride.proteinG) || sm.proteinG;
    document.getElementById("pFatG").value = (p.macroOverride && p.macroOverride.fatG) || sm.fatG;
    refreshProfilePreview();
    profileOverlay.hidden=false;
    document.getElementById("pName").focus();
  }
  document.getElementById("openProfile").addEventListener("click", openProfileModal);
  document.getElementById("cancelProfile").addEventListener("click", function(){ profileOverlay.hidden=true; });
  profileOverlay.addEventListener("click", function(e){ if (e.target===profileOverlay) profileOverlay.hidden=true; });
  document.querySelectorAll("#pSex button").forEach(function(b){
    b.addEventListener("click", function(){ selectedSex=b.dataset.val; document.querySelectorAll("#pSex button").forEach(function(x){x.classList.toggle("active", x===b);}); refreshProfilePreview(); });
  });
  document.getElementById("pTags").addEventListener("click", function(e){
    var b = e.target.closest(".tag-toggle"); if (!b) return;
    var tag = b.dataset.tag; var idx = selectedTags.indexOf(tag);
    if (idx===-1) selectedTags.push(tag); else selectedTags.splice(idx,1);
    b.classList.toggle("active");
  });
  ["pAge","pHeight","pWeight","pBodyFat","pActivity","pGoal","pPace"].forEach(function(id){
    document.getElementById(id).addEventListener("input", refreshProfilePreview);
    document.getElementById(id).addEventListener("change", refreshProfilePreview);
  });
  document.getElementById("resetMacros").addEventListener("click", function(){
    var p = readProfileForm();
    var sm = suggestedMacros(p);
    document.getElementById("pProteinG").value = sm.proteinG;
    document.getElementById("pFatG").value = sm.fatG;
    refreshProfilePreview();
  });
  document.getElementById("profileForm").addEventListener("submit", function(e){
    e.preventDefault();
    var profile = readProfileForm();
    profile.targets = computeTargets(profile);
    state.profile = profile;
    state.isDemo=false;
    save();
    flashSaved(e.target.querySelector('button[type="submit"]'), function(){
      profileOverlay.hidden=true;
      renderAll();
    });
  });

  /* ================= INIT ================= */
  document.addEventListener("keydown", function(e){
    if (e.key==="Escape"){ profileOverlay.hidden=true; foodOverlay.hidden=true; }
  });

  function renderAll(){
    renderBanner();
    renderDashboard();
    renderFood();
    renderWorkout();
    renderMetas();
    renderChat();
    renderInsights();
    document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===state.ui.tab); });
    document.querySelectorAll("[data-view]").forEach(function(v){ v.hidden = v.id !== "view-"+state.ui.tab; });
  }

  load();
  renderAll();

  if (window.claude && window.claude.use){
    claude.use("sample").then(function(s){ sampleFn = s; renderChat(); renderInsights(); }).catch(function(){ sampleFn=null; renderChat(); renderInsights(); });
  } else {
    sampleFn = null; renderChat(); renderInsights();
  }
})();
</script>
