<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Aplica o tema salvo antes do primeiro paint, pra não piscar o tema
      // errado por um instante ao carregar (ver hooks/useTheme.ts).
      (function () {
        try {
          if (localStorage.getItem('nutribase.theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%NutriiBase.favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%NutriiBase.favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>NutriiBase</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
